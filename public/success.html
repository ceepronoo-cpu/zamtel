<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamtel | Success</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f2f2f2;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CONTAINER */
.page{
  width:100%;
  max-width:360px;
  text-align:center;
  padding:20px;
}

/* BRAND NAME */
.brand-name{
  font-size:42px;
  font-weight:600;
  color:#00843d;
  margin-bottom:30px;
}

/* SUCCESS ICON */
.success-icon{
  width:90px;
  height:90px;
  margin:0 auto 24px;
  border-radius:50%;
  background:#00843d;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:pop 0.4s ease-out;
}

.success-icon svg{
  width:48px;
  height:48px;
  stroke:#fff;
  stroke-width:3;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:48;
  stroke-dashoffset:48;
  animation:draw 0.5s ease-out 0.3s forwards;
}

@keyframes pop{
  0%{transform:scale(0);}
  80%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

@keyframes draw{
  to{stroke-dashoffset:0;}
}

/* TITLE */
.success-title{
  font-size:26px;
  font-weight:600;
  color:#333;
  margin-bottom:12px;
}

/* MESSAGE */
.success-message{
  font-size:16px;
  color:#666;
  line-height:1.5;
  margin-bottom:28px;
}

/* DETAILS BOX */
.details{
  background:#fff;
  border:2px solid #00843d;
  border-radius:14px;
  padding:18px;
  margin-bottom:28px;
  text-align:left;
}

.details .row{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  padding:6px 0;
}

.details .row + .row{
  border-top:1px solid #eee;
}

.details .label{
  color:#888;
}

.details .value{
  color:#333;
  font-weight:600;
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  font-size:18px;
  font-weight:600;
  border-radius:14px;
  border:none;
  background:#00843d;
  color:#fff;
  cursor:pointer;
}

button:hover{
  background:#006b31;
}

/* FOOTER */
.footer{
  margin-top:26px;
  font-size:14px;
  color:#666;
}
</style>
</head>

<body>

<div class="page">

  <div class="brand-name">Zamtel</div>

  <div class="success-icon">
    <svg viewBox="0 0 24 24">
      <path d="M4 12 L10 18 L20 6"></path>
    </svg>
  </div>

  <div class="success-title">Success!</div>

  <div class="success-message">
    Your transaction has been completed successfully.
  </div>

  <div class="details" id="detailsBox">
    <div class="row">
      <span class="label">Name</span>
      <span class="value" id="dName">—</span>
    </div>
    <div class="row">
      <span class="label">Phone</span>
      <span class="value" id="dPhone">—</span>
    </div>
    <div class="row">
      <span class="label">Reference</span>
      <span class="value" id="dRef">—</span>
    </div>
  </div>

  <button id="doneBtn">Done</button>

  <div class="footer">
    Thank you for using Zamtel.
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const botId  = params.get("botId");

// Populate the details box from localStorage (if available)
const name  = localStorage.getItem("name")  || "—";
const phone = localStorage.getItem("phone") || "—";
document.getElementById("dName").textContent  = name;
document.getElementById("dPhone").textContent = phone;

// Generate a simple reference for display only
document.getElementById("dRef").textContent =
  "ZAM-" + Date.now().toString().slice(-8);

// Clear identity from localStorage now that the flow is done
localStorage.clear();

// Done button — close the tab or reload
document.getElementById("doneBtn").addEventListener("click", ()=>{
  window.close(); // may be blocked by browsers if tab wasn't opened by script
  // fallback: show a thank-you in place of the button
  document.getElementById("doneBtn").textContent = "Thank you!";
  document.getElementById("doneBtn").disabled = true;
});
</script>

</body>
</html>
